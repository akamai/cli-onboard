[project]
name = "cli-onboard"
version = "2.5.2"
description = "Onboard Akamai delivery and WAF configuration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.1",
    "cerberus==1.3.8",
    "chardet==3.0.4",
    "click==8.4.2",
    "edgegrid-python==1.3.1",
    "emojis==0.7.0",
    "forcediphttpsadapter==1.1.0",
    "jsonschema==4.23.0",
    "openpyxl==3.1.5",
    "pandas==2.3.3",
    "pre-commit>=4.6.0",
    "pyisemail==2.0.1",
    "requests>=2.25.1,<3.0",
    "rich==13.3.2",
    "rich-click==1.8.9",
    "setuptools>=82.0.1",
    "tabulate==0.9.0",
    "uliplot==0.2.4",
    "urllib3>=1.26.5",
    "xlsxwriter==3.2.9",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
pythonpath = ["bin"]
