repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: debug-statements
      - id: double-quote-string-fixer
      - id: requirements-txt-fixer
      - id: check-case-conflict
      - id: check-json
      - id: mixed-line-ending
      # - id: pretty-format-json
  - repo: https://github.com/asottile/reorder_python_imports
    rev: v3.13.0
    hooks:
      - id: reorder-python-imports
        exclude: ^(pre_commit/resources/|testing/resources/python3_hooks_repo/)
        args: [--py37-plus, --add-import, "from __future__ import annotations"]
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.17.0
    hooks:
      - id: pyupgrade
        args: [--py37-plus]
  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        args:
          - "--max-line-length=140"
          - "--max-complexity=18"
          #- "--ignore=E402,F841,F401,E302,E305,E128,E265,C901,F403,F405,E722,W504,E241"
          - "--ignore=E127,E501,E124,E125,E128,E722,F841,C901,F401"
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.45.0
    hooks:
      - id: markdownlint
        files: ^(README|CHANGELOG|CONTRIBUTING)\.md$
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-r", "bin", "-ll"]
        pass_filenames: false
  - repo: local
    hooks:
      - id: sync-cli-manifest
        name: sync cli.json version/description from pyproject.toml
        entry: python bin/sync_cli_manifest.py
        language: system
        files: ^(pyproject\.toml|cli\.json)$
        pass_filenames: false
      - id: sync-readme-commands
        name: sync README's Command catalog from the CLI's registered commands
        entry: uv run python bin/sync_readme_commands.py
        language: system
        files: ^(README\.md|bin/akamai-onboard\.py)$
        pass_filenames: false
      - id: uv-audit
        name: uv audit dependency vulnerability scan
        entry: uv audit --locked --preview-features audit
        language: system
        pass_filenames: false
