name: Security

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-groups --locked

      - name: Dependency vulnerability scan (uv audit)
        run: uv audit --locked --preview-features audit
        env:
          COLUMNS: "120"
          PYTHONUTF8: "1"

      - name: Static analysis security scan (bandit)
        run: uvx bandit -r bin -ll
        env:
          COLUMNS: "120"
          PYTHONUTF8: "1"

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          # Verify the downloaded binary against upstream's published checksums before installing it.
          sha256sum --ignore-missing -c "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          sudo install -m 755 gitleaks /usr/local/bin/gitleaks

      - name: Secret scan (gitleaks)
        run: gitleaks detect --source . -v
